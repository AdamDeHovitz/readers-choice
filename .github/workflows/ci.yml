name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its in-flight run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Everything below runs against dummy env vars or a throwaway local Supabase
# stack (migrations + supabase/seed.sql). No secrets, never production.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
        env:
          # Dummy env vars for build process
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_key
          SUPABASE_SERVICE_ROLE_KEY: dummy_key
          AUTH_SECRET: dummy_secret
          AUTH_GOOGLE_ID: dummy_id
          AUTH_GOOGLE_SECRET: dummy_secret
          NEXTAUTH_URL: http://localhost:3000

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Supabase is the slowest step, so it starts first and runs in the
      # background while everything else installs. setup-cli installs the
      # version in package-lock.json, the one `npx supabase` runs later.
      # Studio and postgres-meta aren't used in CI; skipping them saves pulls.
      - uses: supabase/setup-cli@v3
      - name: Start Supabase (background)
        run: scripts/ci-background.sh start supabase supabase start -x studio,postgres-meta
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # Build meanwhile too: serving a build beats next dev compiling pages
      # mid-test. The URL is the local stack's (supabase/config.toml api.port);
      # dev-local.sh --prebuilt checks it.
      - name: Build the app (background)
        run: scripts/ci-background.sh start build npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      # Headless tests only need the headless shell, and the runner image
      # already has the system libraries it needs, so no --with-deps.
      - run: npx playwright install --only-shell chromium
      - name: Wait for Supabase
        run: scripts/ci-background.sh wait supabase
      - name: Database types match migrations
        run: npm run db:types:check
      - name: Wait for the build
        run: scripts/ci-background.sh wait build
      - run: npx playwright test --reporter=list,html,json
        env:
          E2E_PREBUILT: "1"
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/results.json
      - uses: actions/upload-artifact@v7
        id: report
        if: ${{ !cancelled() }}
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Job summary
        if: ${{ !cancelled() }}
        run: >-
          scripts/e2e-summary.sh "E2E: this PR's code on this PR's database"
          test-results/results.json "${{ steps.report.outputs.artifact-url }}"
          >> "$GITHUB_STEP_SUMMARY"

  # Production gets a PR's migrations before its code deploys, so the code on
  # main must keep working on the migrated database.
  migrations-changed:
    name: Migrations changed?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # the PR merge commit and main, its first parent
      - id: diff
        run: |
          if false; then # TEMP: force Migration compat to run
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes under supabase/migrations/: migration compat check skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  migration-compat:
    name: Migration compat
    needs: migrations-changed
    if: needs.migrations-changed.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
          path: main
      # Same overlap as E2E: Supabase first, the build while it starts. Use
      # main's CLI version; setup-cli would read the PR's lockfile.
      - id: cli
        run: echo "version=$(jq -r '.packages["node_modules/supabase"].version' main/package-lock.json)" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v3
        with:
          version: ${{ steps.cli.outputs.version }}
      # main's migrations and seed first, then the PR's migrations on top of
      # that data: the order production sees them in.
      - name: Start Supabase (background)
        working-directory: main
        run: ../scripts/ci-background.sh start supabase supabase start -x studio,postgres-meta
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: main/package-lock.json
      - run: npm ci
        working-directory: main
      - name: Build main's app (background)
        working-directory: main
        run: ../scripts/ci-background.sh start build npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      - run: npx playwright install --only-shell chromium
        working-directory: main
      - name: Wait for Supabase
        run: scripts/ci-background.sh wait supabase
      - name: Apply this PR's migrations
        working-directory: main
        run: |
          rm -rf supabase/migrations
          cp -R ../supabase/migrations supabase/
          npx supabase migration up --local --include-all
      - name: Wait for the build
        run: scripts/ci-background.sh wait build
      - name: Run main's e2e specs against main's app
        working-directory: main
        run: npx playwright test --reporter=list,html,json
        env:
          E2E_PREBUILT: "1"
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/results.json
      - uses: actions/upload-artifact@v7
        id: report
        if: ${{ !cancelled() }}
        with:
          name: migration-compat-report
          path: main/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Job summary
        if: ${{ !cancelled() }}
        run: >-
          scripts/e2e-summary.sh "Migration compat: main's code on this PR's migrations"
          main/test-results/results.json "${{ steps.report.outputs.artifact-url }}"
          >> "$GITHUB_STEP_SUMMARY"
